name: Build

# Checks that the site builds. It deploys to Firebase Hosting by hand (see README), not from here.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the sibling repos aren't here: sync keeps the committed copies
      - run: npm run build
